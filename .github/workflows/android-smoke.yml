# Tries a built FreeSheet APK on an Android emulator: installs it, taps through the app
# (grade, subject, topic with read-aloud), presses Back, and saves screenshots + the log.
#   gh workflow run android-smoke.yml -f run_id=<id of a "Build Android Edition" run>
name: Android smoke test

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of the "Build Android Edition" run whose APK to test'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FreeSheet-android
          path: apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android-smoke.sh apk/*.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: shots/
