# Builds FreeSheet for Windows, macOS and Linux on real machines (Tauri: the Rust app in
# src-tauri/ plus the screens in src/).
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.1.0.
# Download the installers from the run's "Artifacts" section.
name: Build installers

on:
  workflow_dispatch:
    inputs:
      mac_runner:
        description: 'Runner for the macOS build (try macos-15-intel if Apple Silicon runners are busy; either can build Intel and Apple Silicon apps)'
        default: macos-latest
      platforms:
        description: 'What to build ("mac-linux" when Windows is already built on a PC)'
        type: choice
        options: [all, mac-linux]
        default: all
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The full test suite runs once, beside the builds, instead of in every build job
  # (it compiled the Rust app a second time on each platform: about 2 minutes each).
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test
      - name: Linux build packages
        timeout-minutes: 20
        run: bash scripts/ci-apt.sh libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - run: npm test

  build:
    strategy:
      fail-fast: false
      matrix:
        # Each Mac architecture builds on its own machine, at the same time as the others.
        # Apple Silicon runners (macos-latest) are the easiest to get and build Intel apps too.
        # "mac-linux" leaves Windows out (it is built on the PC).
        include:
          - platform: mac-x64
            os: ${{ inputs.mac_runner || 'macos-latest' }}
            args: --mac --x64
            target: x86_64-apple-darwin
          - platform: mac-arm64
            os: ${{ inputs.mac_runner || 'macos-latest' }}
            args: --mac --arm64
            target: aarch64-apple-darwin
          # The oldest supported Ubuntu, so the AppImage runs on older Linux systems too.
          - platform: linux
            os: ubuntu-22.04
            args: --linux
          - platform: ${{ inputs.platforms == 'mac-linux' && 'skip' || 'win' }}
            os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Not needed this time
        if: matrix.platform == 'skip'
        run: echo "Windows is built on the PC for this run."
      - uses: actions/checkout@v4
        if: matrix.platform != 'skip'
      - uses: actions/setup-node@v4
        if: matrix.platform != 'skip'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform != 'skip'
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: matrix.platform != 'skip'
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - name: Linux build packages
        if: matrix.platform == 'linux'
        timeout-minutes: 20
        run: bash scripts/ci-apt.sh libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
        if: matrix.platform != 'skip'
      # build.js checks the content first (a few seconds); the rest of the tests run in "test".
      - run: node scripts/build.js ${{ matrix.args }}
        if: matrix.platform != 'skip'
      - uses: actions/upload-artifact@v4
        if: matrix.platform != 'skip'
        with:
          name: FreeSheet-${{ matrix.platform }}
          path: |
            build/*.exe
            build/*.msi
            build/*.dmg
            build/*.zip
            build/*.AppImage
            build/*.deb
          compression-level: 0
          if-no-files-found: error
