# Builds FreeSheet for Windows, macOS and Linux on real machines (Tauri: the Rust app in
# src-tauri/ plus the screens in src/).
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.1.0.
# Download the installers from the run's "Artifacts" section.
name: Build installers

on:
  workflow_dispatch:
    inputs:
      mac_runner:
        description: 'Runner for the macOS build (try macos-15-intel if Apple Silicon runners are busy; either can build Intel and Apple Silicon apps)'
        default: macos-latest
      platforms:
        description: 'What to build ("mac-linux" when Windows is already built on a PC)'
        type: choice
        options: [all, mac-linux]
        default: all
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Each Mac architecture builds on its own machine, at the same time as the others.
        platform: [win, mac-x64, mac-arm64, linux]
        include:
          - os: windows-latest
            platform: win
            args: --win
          - os: ${{ inputs.mac_runner || 'macos-latest' }}
            platform: mac-x64
            args: --mac --x64
            target: x86_64-apple-darwin
          - os: ${{ inputs.mac_runner || 'macos-latest' }}
            platform: mac-arm64
            args: --mac --arm64
            target: aarch64-apple-darwin
          # The oldest supported Ubuntu, so the AppImage runs on older Linux systems too.
          - os: ubuntu-22.04
            platform: linux
            args: --linux
        exclude:
          - platform: ${{ inputs.platforms == 'mac-linux' && 'win' || 'none' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - name: Linux build packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - run: npm test
      - run: node scripts/build.js ${{ matrix.args }} --no-validate
      - uses: actions/upload-artifact@v4
        with:
          name: FreeSheet-${{ matrix.platform }}
          path: |
            build/*.exe
            build/*.msi
            build/*.dmg
            build/*.zip
            build/*.AppImage
            build/*.deb
          compression-level: 0
          if-no-files-found: error
