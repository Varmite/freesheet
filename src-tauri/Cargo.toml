[package]
name = "freesheet"
version = "1.3.1"
description = "Offline CAPS study notes, practice questions and exams for Grades 8-12 (English)."
authors = ["FreeSheet"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
# staticlib/cdylib: the Android app loads the same code as a shared library.
name = "freesheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
regex = "1"
unicode-normalization = "0.1"
ureq = "3"
sha2 = "0.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Windows: tell WebView2 to free memory while the window is minimised (same versions Tauri uses).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = "0.9"
ndk-sys = "0.6"
ndk-context = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
