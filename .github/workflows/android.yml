# Builds FreeSheet for Android (an .apk for phones) from the same Rust app (src-tauri/)
# and screens (src/) as the desktop version. See scripts/build-android.js.
# Run it from the Actions tab ("Run workflow"), or push a tag like android-v1.1.0.
# Download the APK from the run's "Artifacts" section.
name: Build Android Edition

on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The Android SDK and NDK come with GitHub's Ubuntu runners.
      - name: Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK $NDK"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: node scripts/validate-content.js && node scripts/test-marking.js && node scripts/test-course.js
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FREESHEET_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: the APK is signed with a debug key."
          fi
      - run: node scripts/build-android.js
        env:
          FREESHEET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FREESHEET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FREESHEET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: FreeSheet-android
          path: build/android/*.apk
          compression-level: 0
          if-no-files-found: error
