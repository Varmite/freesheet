[package]
name = "freesheet"
version = "1.2.1"
description = "Offline CAPS study notes, practice questions and exams for Grades 8-12 (English)."
authors = ["FreeSheet"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
default-run = "freesheet"

[lib]
name = "freesheet"
# cdylib: the Android app loads the same code as a shared library.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "freesheet"
path = "src/main.rs"

[dependencies]
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
include_dir = "0.7"
regex = "1"
fancy-regex = "0.20"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2"
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"] }
ttf-parser = "0.25"
opus-pure = "0.2"
cpal = "0.18"
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
dirs = "7"
open = "5"
# AI marking (see src/ai): pure Rust, nothing is downloaded until the learner agrees.
candle-core = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["unstable_wasm"] }
ureq = "3"
sha2 = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-game-activity"] }
android_logger = "0.15"
jni = "0.21"
ndk = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Faster debug builds for the heavy pure-Rust parts (decoding, rasterising).
[profile.dev.package."*"]
opt-level = 2
