<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>FreeSheet</title>
  <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">FreeSheet</div>
    <nav class="tabs" role="tablist" aria-label="Main">
      <button class="tab" role="tab" data-tab="study">Study</button>
      <button class="tab" role="tab" data-tab="exams">Exams</button>
      <button class="tab" role="tab" data-tab="progress">Progress</button>
    </nav>
    <label class="grade-picker">
      <span>Grade</span>
      <select id="grade-select" aria-label="Grade"></select>
    </label>
  </header>
  <main id="main" tabindex="-1">
    <div class="loading">Loading…</div>
  </main>
  <div id="dialog-root"></div>

  <script src="../node_modules/katex/dist/katex.min.js"></script>
  <script src="js/markup.js"></script>
  <script src="js/marking.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
