<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>FreeSheet</title>
  <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span id="brand-logo"></span>FreeSheet</div>
    <nav class="tabs" role="tablist" aria-label="Main">
      <button class="tab" role="tab" data-tab="study"><span class="tab-icon" data-icon="study"></span>Study</button>
      <button class="tab" role="tab" data-tab="exams"><span class="tab-icon" data-icon="exams"></span>Exams</button>
      <button class="tab" role="tab" data-tab="progress"><span class="tab-icon" data-icon="progress"></span>Progress</button>
    </nav>
    <button class="streak-btn" id="streak-btn" type="button" aria-label="Daily streak"></button>
    <label class="grade-picker">
      <span>Grade</span>
      <select id="grade-select" aria-label="Grade"></select>
    </label>
    <button class="top-icon-btn" id="settings-btn" type="button" aria-label="Settings" title="Settings"></button>
  </header>
  <main id="main" tabindex="-1">
    <div class="loading">Loading…</div>
  </main>
  <div id="dialog-root"></div>

  <script src="../node_modules/katex/dist/katex.min.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/markup.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/readalong.js"></script>
  <script src="js/streak.js"></script>
  <script src="js/marking.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
