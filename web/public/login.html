<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · FreeSheet</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#1b1c1f">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="card">
    <img class="logo" src="/icon-192.png" alt="" width="64" height="64">
    <h1>FreeSheet</h1>
    <p class="lead">Notes, practice questions and exams for the CAPS curriculum, Grades 8 to 12.</p>
    <form id="login">
      <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Username" aria-label="Username" required>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
      <button type="submit" id="go">Sign in</button>
    </form>
    <p id="error" class="error" role="alert" hidden></p>
    <p class="note">Your progress is saved to your account on this server, so you can carry on from any phone or computer.</p>
  </main>

  <script>
  (function () {
    'use strict';
    var form = document.getElementById('login');
    var errorEl = document.getElementById('error');
    var go = document.getElementById('go');
    function showError(msg) { errorEl.textContent = msg; errorEl.hidden = false; }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.hidden = true;
      go.disabled = true;
      fetch('/auth/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }),
      }).then(function (r) {
        return r.json().then(function (v) {
          if (r.ok) { location.href = '/'; return; }
          go.disabled = false;
          showError(v.error || 'Sign-in failed.');
          document.getElementById('password').select();
        });
      }).catch(function () {
        go.disabled = false;
        showError('Could not reach the server. Check your connection and try again.');
      });
    });
    document.getElementById('username').focus();
  })();
  </script>
</body>
</html>
